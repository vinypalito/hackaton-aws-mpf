<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Painel de expedientes</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <!--
    CSS crítico do splash de abertura. Fica inline porque o bundle de estilos
    carrega depois; as cores repetem os tokens do tema (styles.css):
    papel #f5f4ef, azul institucional #1d3c87 e tinta-3 #4a4f5a.
  -->
  <style>
    .splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      padding: 1rem;
      background: #f5f4ef;
      color: #4a4f5a;
      font: 500 0.9375rem/1.4 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
    }
    .splash-tsuru {
      width: min(160px, 50vw);
      height: auto;
      overflow: visible;
      animation: splash-flutuar 2.4s ease-in-out 1.6s infinite;
    }
    /* Cada peça do origami: traço desenhado (pathLength=1) e depois preenchido. */
    .splash-tsuru path {
      fill: #1d3c87;
      fill-opacity: 0;
      stroke: #1d3c87;
      stroke-width: 2;
      stroke-linejoin: round;
      stroke-dasharray: 1;
      stroke-dashoffset: 1;
      animation: splash-tracar 0.9s ease-out forwards, splash-preencher 0.5s ease-out forwards;
    }
    .splash-tsuru path:nth-child(1) { animation-delay: 0s, 0.9s; }
    .splash-tsuru path:nth-child(2) { animation-delay: 0.1s, 1s; }
    .splash-tsuru path:nth-child(3) { animation-delay: 0.2s, 1.1s; }
    .splash-tsuru path:nth-child(4) { animation-delay: 0.3s, 1.2s; }
    .splash-tsuru path:nth-child(5) { animation-delay: 0.4s, 1.3s; }
    .splash-tsuru path:nth-child(6) { animation-delay: 0.5s, 1.4s; }
    /* A asa bate em torno da dobra junto ao corpo (x = 96 no viewBox). */
    .splash-tsuru path.splash-asa {
      transform-box: view-box;
      transform-origin: 96px 56px;
      animation: splash-tracar 0.9s ease-out forwards, splash-preencher 0.5s ease-out 0.9s forwards,
        splash-bater 1.2s ease-in-out 1.6s infinite;
    }
    .splash-texto { margin: 0; }
    .splash-oculto {
      position: absolute;
      width: 1px;
      height: 1px;
      margin: -1px;
      padding: 0;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    @keyframes splash-tracar { to { stroke-dashoffset: 0; } }
    @keyframes splash-preencher { to { fill-opacity: 1; } }
    @keyframes splash-flutuar {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    @keyframes splash-bater {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-14deg); }
    }
    /* Movimento reduzido: tsuru estático, já preenchido. */
    @media (prefers-reduced-motion: reduce) {
      .splash-tsuru,
      .splash-tsuru path,
      .splash-tsuru path.splash-asa {
        animation: none;
      }
      .splash-tsuru path {
        fill-opacity: 1;
        stroke-dashoffset: 0;
      }
    }
  </style>
</head>
<body>
  <app-root>
    <!-- Splash de abertura: o Angular substitui este conteúdo ao iniciar. -->
    <div class="splash" role="status" aria-live="polite">
      <!-- Tsuru da marca Único (mesmos paths do sprite "tsuru-mark" da apresentação). -->
      <svg class="splash-tsuru" viewBox="0 0 232 177" aria-hidden="true" focusable="false">
        <path class="splash-asa" pathLength="1" d="M96 1 L96 56 L1 2 Z"/>
        <path pathLength="1" d="M103 1 L199 83 L103 165 Z"/>
        <path pathLength="1" d="M203 17 L203 78 L169 50 Z"/>
        <path pathLength="1" d="M209 16 L230 23 L208 31 Z"/>
        <path pathLength="1" d="M58 143 L97 143 L96 165 Z"/>
        <path pathLength="1" d="M55 147 L70 157 L55 175 Z"/>
      </svg>
      <p class="splash-texto" aria-hidden="true">Carregando…</p>
      <span class="splash-oculto">Carregando o Painel de Expedientes</span>
    </div>
  </app-root>
  <noscript>O painel de expedientes precisa de JavaScript habilitado.</noscript>
</body>
</html>
